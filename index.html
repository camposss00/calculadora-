<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="calculator" id="calculator">
    <section class="display" aria-live="polite">
      <div class="display__expression" id="expression"></div>
      <div class="display__current" id="current">0</div>
    </section>

    <section class="keys">
      <button class="key key--function" data-action="clear">C</button>
      <button class="key key--function" data-action="delete">⌫</button>
      <button class="key key--function" data-action="percent">%</button>
      <button class="key key--operator" data-action="operator" data-operator="÷">÷</button>

      <button class="key" data-action="number" data-number="7">7</button>
      <button class="key" data-action="number" data-number="8">8</button>
      <button class="key" data-action="number" data-number="9">9</button>
      <button class="key key--operator" data-action="operator" data-operator="×">×</button>

      <button class="key" data-action="number" data-number="4">4</button>
      <button class="key" data-action="number" data-number="5">5</button>
      <button class="key" data-action="number" data-number="6">6</button>
      <button class="key key--operator" data-action="operator" data-operator="-">−</button>

      <button class="key" data-action="number" data-number="1">1</button>
      <button class="key" data-action="number" data-number="2">2</button>
      <button class="key" data-action="number" data-number="3">3</button>
      <button class="key key--operator" data-action="operator" data-operator="+">+</button>

      <button class="key key--wide" data-action="sign">±</button>
      <button class="key" data-action="number" data-number="0">0</button>
      <button class="key" data-action="decimal">,</button>
      <button class="key key--equals" data-action="equals">=</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
